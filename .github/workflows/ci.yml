name: Numerai Fleet Quant CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pandas scipy lightgbm numerapi joblib python-dotenv yfinance pyarrow

      - name: Build Native Chimera Evaluator
        run: |
          make build-chimera

      - name: Run Test Suite
        env:
          NUMERAI_PUBLIC_ID: "mock_ci_public_id"
          NUMERAI_SECRET_KEY: "mock_ci_secret_key"
        run: python -m pytest -v


